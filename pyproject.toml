[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rimeskg-reproduction"
version = "0.1.0"
description = "Auditable RIMES-KG V3 research protocol and reproduction code"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3", "PyYAML>=6.0", "requests>=2.30"]

[project.scripts]
rimes = "rimeskg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
